name: RandDB pre-release

on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing prerelease tag, for example v0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: randdb-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prerelease:
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      prerelease: true
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
