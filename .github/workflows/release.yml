name: RandDB release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: randdb
          - os: macos-14
            target: aarch64-apple-darwin
            binary: randdb
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: randdb.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "randdb") | .version')
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          tar -czf "dist/randdb-${GITHUB_REF_NAME}-${TARGET}.tar.gz" -C target/release "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: randdb-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: randdb-*
          merge-multiple: true
          path: dist
      - name: Publish archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.tar.gz >SHA256SUMS
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${FLAGS[@]}" ./*
